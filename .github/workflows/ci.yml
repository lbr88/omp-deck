name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single Ubuntu gate: typecheck + test + web build.
  # macOS/Windows matrix and the Docker boot smoke job were dropped to
  # keep CI cheap; tests still run on every push/PR to main.
  ci:
    name: ubuntu · bun 1.3.14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: bun install (frozen)
        run: bun install --frozen-lockfile

      - name: typecheck (all workspaces)
        run: bun run typecheck

      - name: test (all workspaces)
        run: bun test

      - name: web build
        run: bun --cwd apps/web run build
